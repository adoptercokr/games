<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>똥 싸는 댕댕이의 산책 - Pooing Dog Adventure (PRO)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&family=Nanum+Gothic:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --retro-gray: #1b1e2e;
      --retro-dark: #090a16;
      --retro-bezel: #25283d;
      --neon-cyan: #00f0ff;
      --neon-coral: #ff4a76;
      --neon-green: #39ff14;
      --neon-gold: #ffd700;
      
      --pixel-border: 4px solid #00f0ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #060713;
      font-family: 'Nanum Gothic', 'Jua', sans-serif;
      color: white;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Game Console Box */
    .console-wrapper {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 850px;
      background: var(--retro-gray);
      border: 4px solid var(--neon-cyan);
      border-radius: 24px 24px 64px 24px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.25),
                  inset 4px 4px 0 rgba(255,255,255,0.05),
                  inset -4px -4px 0 rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      padding: 18px;
      position: relative;
    }
    @media (max-width: 480px) {
      .console-wrapper {
        border-radius: 0;
        border: none;
        max-height: 100vh;
      }
    }

    /* Screen Frame Bezel */
    .screen-bezel {
      background: var(--retro-bezel);
      border: 3px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.3);
    }
    .screen-bezel::before {
      content: 'COLOR MATRIX STYLISH GAME';
      position: absolute;
      top: 4px; left: 50%;
      transform: translateX(-50%);
      font-family: 'Press Start 2P', sans-serif;
      font-size: 7px;
      color: var(--neon-cyan);
      opacity: 0.8;
      letter-spacing: 0.5px;
    }

    /* Main CRT Game Screen Canvas */
    .screen-inner {
      background: #0f1026; 
      border: 4px solid var(--retro-dark);
      border-radius: 6px;
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 8px 0 rgba(0,0,0,0.5);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0f1026;
    }

    /* Console Controllers Base Area */
    .controls-panel {
      padding: 16px 0 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .brand-logo {
      text-align: center;
      font-family: 'Press Start 2P', sans-serif;
      font-size: 11px;
      color: var(--neon-cyan);
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    /* Action Buttons Area */
    .action-board {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
    }

    /* Directional Pad Decor */
    .dpad-container {
      width: 80px;
      height: 80px;
      position: relative;
    }
    .dpad-cross {
      background: #111322;
      width: 24px;
      height: 74px;
      position: absolute;
      left: 28px; top: 3px;
      border-radius: 4px;
      box-shadow: inset 2px 2px 0 rgba(255,255,255,0.05), 2px 2px 0 rgba(0,0,0,0.4);
      border: 1px solid rgba(0, 240, 255, 0.1);
    }
    .dpad-cross.horizontal {
      width: 74px;
      height: 24px;
      left: 3px; top: 28px;
    }
    .dpad-center {
      position: absolute;
      width: 24px; height: 24px;
      left: 28px; top: 28px;
      background: #060713;
      border-radius: 50%;
    }

    /* Right Tactile Handheld Action Buttons */
    .buttons-container {
      display: flex;
      gap: 16px;
      transform: rotate(-10deg);
    }
    .game-button-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .game-button-wrapper span {
      font-family: 'Press Start 2P', sans-serif;
      font-size: 8px;
      color: var(--text-muted);
    }
    .action-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3px solid #00f0ff;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s;
    }
    .action-btn:active {
      transform: scale(0.92);
    }
    .btn-b {
      background: linear-gradient(135deg, var(--neon-coral), #b55fe6);
      box-shadow: inset 2px 2px 0 rgba(255,255,255,0.2), 0 0 10px rgba(255, 74, 118, 0.3);
    }
    .btn-a {
      background: linear-gradient(135deg, var(--neon-cyan), #b55fe6);
      box-shadow: inset 2px 2px 0 rgba(255,255,255,0.2), 0 0 10px rgba(0, 240, 255, 0.3);
    }
    .action-btn-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Jua', sans-serif;
      font-size: 16px;
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
    }

    /* Start / Select pill buttons */
    .pills-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 8px;
    }
    .pill-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .pill-wrapper span {
      font-family: 'Press Start 2P', sans-serif;
      font-size: 6px;
      color: #64748b;
    }
    .pill-btn {
      width: 44px;
      height: 11px;
      background: #334155;
      border: 2px solid var(--neon-cyan);
      border-radius: 8px;
      transform: skewX(-24deg);
      box-shadow: 2px 2px 0 rgba(0,0,0,0.4);
      transition: background 0.1s;
    }
    .pill-btn:active {
      background: #1e293b;
    }

    /* Slanted Speaker Grill Ornament */
    .speaker-slots {
      position: absolute;
      right: 20px; bottom: 15px;
      display: flex;
      gap: 6px;
    }
    .speaker-slit {
      width: 6px;
      height: 32px;
      background: #272a44;
      transform: skewX(-28deg);
      border-radius: 2px;
      box-shadow: inset -1.5px -1.5px 0 rgba(255,255,255,0.05), inset 1.5px 1.5px 0 rgba(0,0,0,0.3);
    }

    /* Game Interface HUD / State overlays */
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(8, 7, 24, 0.94); 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: #ffffff;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .overlay-screen.hidden {
      display: none !important;
    }

    .overlay-title {
      font-family: 'Jua', sans-serif;
      font-size: 28px;
      line-height: 1.1;
      margin-bottom: 8px;
      color: var(--neon-gold); 
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }
    .overlay-subtitle {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 20px;
      color: #94a3b8;
      max-width: 290px;
    }

    .clean-disclaimer {
      background: rgba(255, 74, 118, 0.08);
      border: 2px dashed var(--neon-coral);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 24px;
      color: var(--neon-coral);
      max-width: 320px;
      text-shadow: 0 0 8px rgba(255, 74, 118, 0.2);
    }

    .big-start-btn {
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      border: 2.5px solid #fff;
      color: #ffffff;
      font-family: 'Jua', sans-serif;
      font-size: 18px;
      padding: 10px 28px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .big-start-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 5px rgba(0, 240, 255, 0.2);
    }
    
    .score-summary-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 10px 20px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 260px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 800;
      margin: 4px 0;
      color: #cbd5e1;
    }
    .summary-val {
      font-family: 'Press Start 2P', sans-serif;
      font-size: 10px;
      color: var(--neon-cyan);
    }
  </style>
</head>
<body>

  <div class="console-wrapper">
    
    <!-- RETRO BEZEL -->
    <div class="screen-bezel">
      <div class="screen-inner">
        
        <!-- Canvas Game viewport -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- START / WELCOME OVERLAY -->
        <div class="overlay-screen" id="welcomeScreen">
          <div style="font-size: 40px; margin-bottom: 8px;">🐶💩🏃💨</div>
          <h1 class="overlay-title">응가 댕댕이의 산책</h1>
          <p class="overlay-subtitle">주인이 한눈팔거나 멈췄을 때,<br>잽싸게 똥을 많이 싸서 점수를 모으세요!<br>장애물은 타이밍 맞춰 점프!</p>
          <button class="big-start-btn" onclick="startGame()">산책 시작하기!</button>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div class="overlay-screen hidden" id="gameOverScreen">
          <div style="font-size: 44px; margin-bottom: 8px;">🧹💩🧼✨</div>
          <h1 class="overlay-title">산책 끝! (게임 오버)</h1>
          
          <div class="score-summary-box">
            <div class="summary-row">
              <span>총 점수 (SCORE)</span>
              <span class="summary-val" id="finalScore">0000</span>
            </div>
            <div class="summary-row">
              <span>투척한 응가 (POOP)</span>
              <span class="summary-val" id="finalPoops">0</span>
            </div>
          </div>

          <!-- EDUCATIONAL ECO DISCLAIMER -->
          <div class="clean-disclaimer">
            ⚠️ 산책이 끝나면 주인은 꼭 반려견의 예쁜 응가를 깨끗하게 치워야 합니다! (배변봉투 지참 필수)
          </div>

          <button class="big-start-btn" onclick="startGame()">다시 산책하기</button>
        </div>

      </div>
    </div>

    <!-- CONSOLE BUTTONS -->
    <footer class="controls-panel">
      <div class="brand-logo">SPARK COLOR GAME BOY</div>
      
      <div class="action-board">
        <!-- Decoration Left Dpad -->
        <div class="dpad-container">
          <div class="dpad-cross"></div>
          <div class="dpad-cross horizontal"></div>
          <div class="dpad-center"></div>
        </div>
        
        <!-- Interactive Right Buttons (Tap triggers poops/jumps) -->
        <div class="buttons-container">
          <div class="game-button-wrapper">
            <div class="action-btn btn-b" onclick="triggerPoopPress()" id="btnPoop">
              <span class="action-btn-label">응가</span>
            </div>
            <span>POOP (B)</span>
          </div>
          
          <div class="game-button-wrapper">
            <div class="action-btn btn-a" onclick="triggerJump()" id="btnJump">
              <span class="action-btn-label">점프</span>
            </div>
            <span>JUMP (A)</span>
          </div>
        </div>
      </div>

      <!-- Start/Select decor -->
      <div class="pills-container">
        <div class="pill-wrapper" onclick="toggleMute()">
          <div class="pill-btn"></div>
          <span>MUTE</span>
        </div>
        <div class="pill-wrapper" onclick="location.reload()">
          <div class="pill-btn"></div>
          <span>RESET</span>
        </div>
      </div>

      <!-- Speaker Grills decor -->
      <div class="speaker-slots">
        <div class="speaker-slit"></div>
        <div class="speaker-slit"></div>
        <div class="speaker-slit"></div>
        <div class="speaker-slit"></div>
      </div>
    </footer>

  </div>

  <!-- ─── RETRO AUDIO & GAMEPLAY ENGINE ─── -->
  <script>
    // Audio synthesis setup
    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          console.warn("AudioContext not supported", e);
        }
      }
    }

    function playSound(type) {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        return;
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'poop') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(45, now + 0.25);
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(220, now);
        
        osc.disconnect(gain);
        osc.connect(filter);
        filter.connect(gain);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.linearRampToValueAtTime(10, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(659.25, now); // E5
        osc.frequency.setValueAtTime(987.77, now + 0.08); // B5
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'gameover') {
        osc.type = 'sine';
        const notes = [329.63, 293.66, 261.63, 196.00]; // E4, D4, C4, G3
        notes.forEach((freq, idx) => {
          const t = now + idx * 0.15;
          const oscNode = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          oscNode.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          
          oscNode.frequency.setValueAtTime(freq, t);
          gainNode.gain.setValueAtTime(0.08, t);
          gainNode.gain.linearRampToValueAtTime(0.001, t + 0.22);
          oscNode.start(t);
          oscNode.stop(t + 0.22);
        });
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      const span = document.querySelector('.pill-wrapper span');
      span.textContent = isMuted ? "UNMUTE" : "MUTE";
    }

    // ─── GAME STATE & VARIABLES ───
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameActive = false;
    let score = 0;
    let poopCount = 0;
    let lives = 3;

    let dogX = 110;
    let dogY = 0;
    let dogYVelocity = 0;
    let isJumping = false;
    const gravity = 0.65;
    const dogGroundY = 190;

    let dogState = 'run'; // 'run', 'poop', 'hit', 'jump'
    let dogAnimFrame = 0;
    let dogAnimTimer = 0;

    // Leash Owner variables
    let ownerState = 'walk'; // 'walk', 'distracted'
    let ownerTimer = 120;
    let ownerX = 260; // Walks ahead

    let obstacles = [];
    let spawnedPoops = [];
    let cloudX = 0;
    let treesX = 0;
    let fenceX = 0;
    let gameSpeed = 3.2;

    // Screen Shake & Spark particles
    let shakeTimer = 0;
    let textParticles = [];
    let stars = Array.from({ length: 40 }, () => ({
      x: Math.random() * 400,
      y: Math.random() * 120,
      size: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.1 + 0.05
    }));

    // Mobile aspect-ratio sizing
    function resizeCanvas() {
      canvas.width = 400;
      canvas.height = 300;
    }
    resizeCanvas();

    // Key event listeners
    window.addEventListener('keydown', (e) => {
      if (!gameActive) return;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyZ') {
        triggerJump();
        e.preventDefault();
      }
      if (e.code === 'KeyX' || e.code === 'ArrowDown') {
        triggerPoopPress();
        e.preventDefault();
      }
    });

    // Tap/Touch controls on actual buttons
    function triggerJump() {
      if (!gameActive) return;
      if (!isJumping) {
        dogYVelocity = -9.5;
        isJumping = true;
        dogState = 'jump';
        playSound('jump');
      }
    }

    function triggerPoopPress() {
      if (!gameActive) return;
      
      // Can only poop when owner is stopped & distracted!
      if (ownerState === 'distracted') {
        dogState = 'poop';
        poopCount++;
        score += 150; // High score multiplier!
        playSound('poop');
        
        // Spawn a physical poop on the scrolling grass
        spawnedPoops.push({
          x: dogX + 4,
          y: dogGroundY + 12
        });

        // Visual Spark Text Particles
        textParticles.push({
          x: dogX + 12,
          y: dogY - 10,
          text: 'COOL POOP!',
          color: '#ffd700',
          alpha: 1.0,
          vy: -1.2,
          size: 9
        });
        textParticles.push({
          x: dogX + 26,
          y: dogY - 24,
          text: '+150',
          color: '#00ffff',
          alpha: 1.0,
          vy: -1.5,
          size: 11
        });
      } else {
        // Owner pulls leash penalty!
        score = Math.max(0, score - 50);
        dogState = 'hit';
        playSound('hit');

        textParticles.push({
          x: dogX + 10,
          y: dogY - 12,
          text: 'Oops! -50',
          color: '#ff4a76',
          alpha: 1.0,
          vy: -0.9,
          size: 9
        });

        setTimeout(() => { if (dogState === 'hit') dogState = 'run'; }, 400);
      }
    }

    // ─── START GAME ───
    function startGame() {
      initAudio();
      
      document.getElementById('welcomeScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');

      // Reset states
      score = 0;
      poopCount = 0;
      lives = 3;
      dogY = dogGroundY;
      dogYVelocity = 0;
      isJumping = false;
      dogState = 'run';
      ownerState = 'walk';
      ownerTimer = 150;
      obstacles = [];
      spawnedPoops = [];
      textParticles = [];
      gameSpeed = 3.2;
      shakeTimer = 0;
      gameActive = true;

      animate();
    }

    // ─── CORE GAME LOOP ───
    function animate() {
      if (!gameActive) return;

      updatePhysics();
      checkCollisions();
      draw();

      requestAnimationFrame(animate);
    }

    function updatePhysics() {
      // 1. Dog Jump physics
      if (isJumping) {
        dogY += dogYVelocity;
        dogYVelocity += gravity;
        
        if (dogY >= dogGroundY) {
          dogY = dogGroundY;
          isJumping = false;
          if (dogState === 'jump') dogState = 'run';
        }
      }

      // Restore dogState to run after anim completes
      if (dogState === 'poop') {
        dogAnimTimer++;
        if (dogAnimTimer > 20) {
          dogState = 'run';
          dogAnimTimer = 0;
        }
      }

      // 2. Owner AI Behavior
      ownerTimer--;
      if (ownerTimer <= 0) {
        if (ownerState === 'walk') {
          ownerState = 'distracted';
          ownerTimer = Math.floor(Math.random() * 80) + 70; // Stops for 1.5 - 2.5 seconds
        } else {
          ownerState = 'walk';
          ownerTimer = Math.floor(Math.random() * 150) + 120; // Walks for 3 - 5 seconds
        }
      }

      // If owner walks, elements speed up. If owner stops, speed drops nicely
      let targetSpeed = ownerState === 'walk' ? 3.4 : 1.2;
      gameSpeed += (targetSpeed - gameSpeed) * 0.1;

      // 3. Move backgrounds
      cloudX = (cloudX - gameSpeed * 0.12) % canvas.width;
      treesX = (treesX - gameSpeed * 0.35) % canvas.width;
      fenceX = (fenceX - gameSpeed * 0.8) % canvas.width;

      // Background stars drift
      stars.forEach(s => {
        s.x -= gameSpeed * s.speed;
        if (s.x < 0) s.x = canvas.width;
      });

      // 4. Handle obstacles
      if (Math.random() * 100 < 1.3 && ownerState === 'walk') {
        // Spawn rolling spiked ball or running cat
        obstacles.push({
          x: canvas.width + 20,
          y: dogGroundY + 4,
          width: 18,
          height: 18,
          type: Math.random() > 0.4 ? 'ball' : 'cat'
        });
      }

      obstacles.forEach(obs => {
        obs.x -= gameSpeed;
      });
      obstacles = obstacles.filter(obs => obs.x > -40);

      // 5. Handle deposited poops
      spawnedPoops.forEach(p => {
        p.x -= gameSpeed;
      });
      spawnedPoops = spawnedPoops.filter(p => p.x > -30);

      // 6. Update Text Particles
      for (let i = textParticles.length - 1; i >= 0; i--) {
        const p = textParticles[i];
        p.y += p.vy;
        p.alpha -= 0.02;
        if (p.alpha <= 0) {
          textParticles.splice(i, 1);
        }
      }

      // Add small trickle passive score when running
      if (ownerState === 'walk') {
        score += 1;
      }
    }

    function checkCollisions() {
      // Loop backwards to safely remove collided obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        const dogWidth = 24;
        const dogHeight = 18;
        
        if (
          dogX < obs.x + obs.width &&
          dogX + dogWidth > obs.x &&
          dogY < obs.y + obs.height &&
          dogY + dogHeight > obs.y
        ) {
          // HIT!
          obstacles.splice(i, 1);
          lives--;
          dogState = 'hit';
          shakeTimer = 18; // Trigger camera shake
          playSound('hit');

          textParticles.push({
            x: dogX + 8,
            y: dogY - 14,
            text: 'OUCH!!',
            color: '#ff4a76',
            alpha: 1.0,
            vy: -1.4,
            size: 12
          });
          
          if (lives <= 0) {
            endGame();
            break;
          } else {
            setTimeout(() => { if (dogState === 'hit') dogState = 'run'; }, 500);
          }
        }
      }
    }

    function endGame() {
      gameActive = false;
      playSound('gameover');
      
      document.getElementById('finalScore').textContent = String(score).padStart(4, '0');
      document.getElementById('finalPoops').textContent = poopCount;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    // ─── RENDER ENGINE (STYLISH ART ON CANVAS) ───
    function draw() {
      ctx.save();

      // Screen Shake translation
      let shakeX = 0;
      let shakeY = 0;
      if (shakeTimer > 0) {
        shakeX = (Math.random() - 0.5) * 6;
        shakeY = (Math.random() - 0.5) * 6;
        shakeTimer--;
      }
      ctx.translate(shakeX, shakeY);

      // 1. Draw Sky background (Deep Sunset Gradient)
      let skyGrad = ctx.createLinearGradient(0, 0, 0, 208);
      skyGrad.addColorStop(0, '#0a0d1e');
      skyGrad.addColorStop(0.6, '#1e1c3e');
      skyGrad.addColorStop(1, '#3b1c4c');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = Math.random() * 0.4 + 0.4;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1.0;

      // 2. Draw Clouds (Glowing Purple-Pink)
      drawClouds();

      // 3. Draw Park Trees (Layered silhouettes)
      drawTrees();

      // 4. Draw Park Fence
      drawFence();

      // 5. Draw Ground Grass (Bright Cyber Green/Teal)
      let grassGrad = ctx.createLinearGradient(0, 208, 0, 300);
      grassGrad.addColorStop(0, '#0f382a');
      grassGrad.addColorStop(0.1, '#134e3a');
      grassGrad.addColorStop(1, '#08251c');
      ctx.fillStyle = grassGrad;
      ctx.fillRect(0, 208, canvas.width, 92);
      
      // Neon grass outline
      ctx.fillStyle = '#39ff14';
      ctx.fillRect(0, 208, canvas.width, 3);

      // 6. Draw Poops deposited on ground
      spawnedPoops.forEach(p => {
        drawPixelPoop(p.x, p.y);
      });

      // 7. Draw Owner
      drawOwner();

      // 8. Leash String (Neon red wire)
      ctx.beginPath();
      ctx.strokeStyle = '#ff4a76';
      ctx.lineWidth = 1.8;
      ctx.shadowBlur = 4;
      ctx.shadowColor = '#ff4a76';
      
      let slackY = ownerState === 'walk' ? 12 : 26;
      ctx.moveTo(dogX + 16, dogY + 4);
      ctx.bezierCurveTo(dogX + 16, dogY + 4, (dogX + ownerX)/2, dogGroundY + slackY, ownerX - 6, dogGroundY - 8);
      ctx.stroke();
      ctx.shadowBlur = 0; // Reset shadow

      // 9. Draw Dog
      drawDog();

      // 10. Draw Obstacles
      drawObstacles();

      // 11. Draw Score & Text Particles
      drawHUD();
      drawTextParticles();

      ctx.restore();
    }

    // Modernized Pixel Art Cloud Drawer
    function drawClouds() {
      ctx.fillStyle = '#ff79c6';
      ctx.globalAlpha = 0.12;
      for (let i = 0; i < 3; i++) {
        let cx = (cloudX + i * 160) % (canvas.width + 60) - 40;
        let cy = 35 + (i % 2) * 14;
        ctx.fillRect(cx, cy, 48, 10);
        ctx.fillRect(cx + 10, cy - 6, 28, 6);
        ctx.fillRect(cx + 18, cy - 10, 12, 4);
      }
      ctx.globalAlpha = 1.0;
    }

    // Modernized Park Trees Background
    function drawTrees() {
      ctx.fillStyle = '#321c47';
      ctx.globalAlpha = 0.6;
      for (let i = 0; i < 6; i++) {
        let tx = (treesX + i * 80) % (canvas.width + 40) - 20;
        ctx.fillRect(tx, 155, 12, 53); // Trunk
        
        ctx.fillStyle = '#1c1b3f'; // Dark foliage overlay
        ctx.fillRect(tx - 12, 130, 36, 25);
        ctx.fillRect(tx - 6, 115, 24, 15);
        ctx.fillRect(tx - 2, 105, 16, 10);
        
        ctx.fillStyle = '#321c47'; // Reset color
      }
      ctx.globalAlpha = 1.0;
    }

    // Added Fence Renderer for park aesthetic depth
    function drawFence() {
      ctx.fillStyle = '#261b35';
      for (let i = 0; i < 18; i++) {
        let fx = (fenceX + i * 26) % (canvas.width + 20) - 10;
        ctx.fillRect(fx, 192, 4, 16); // vertical posts
        if (i % 2 === 0) {
          ctx.fillRect(fx, 195, 28, 2); // horizontal rails
          ctx.fillRect(fx, 202, 28, 2);
        }
      }
    }

    // Beautifully render our pixelated corgi dog character (Orange & White Corgi)
    function drawDog() {
      ctx.save();
      ctx.translate(dogX, dogY);

      dogAnimFrame++;
      let isLegUp = Math.floor(dogAnimFrame / 6) % 2 === 0 && dogState === 'run';

      if (dogState === 'hit') {
        // Corgi Hit Flashed state
        ctx.fillStyle = '#ff4a76';
        ctx.fillRect(0, 0, 24, 16);
      } else if (dogState === 'poop') {
        // Squatted Corgi
        ctx.fillStyle = '#f59e0b'; // Corgi Orange
        ctx.fillRect(0, 4, 18, 12); 
        ctx.fillStyle = '#ffffff'; // White chest
        ctx.fillRect(10, 8, 8, 8);
        ctx.fillRect(6, 12, 10, 4);
        ctx.fillStyle = '#d97706'; // Dark orange head
        ctx.fillRect(12, 0, 8, 8);
        
        // Corgi Ears
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(13, -4, 2, 4);
        ctx.fillRect(17, -4, 2, 4);
        ctx.fillStyle = '#ff79c6'; // Pink inside ear
        ctx.fillRect(14, -2, 1, 2);
        ctx.fillRect(18, -2, 1, 2);
        
        ctx.fillStyle = '#d97706'; // Tail
        ctx.fillRect(-2, 2, 4, 4);
        
        ctx.fillStyle = '#78350f'; // Legs
        ctx.fillRect(2, 16, 3, 2);
        ctx.fillRect(14, 16, 3, 2);
      } else {
        // Running Corgi
        ctx.fillStyle = '#f59e0b'; // Body
        ctx.fillRect(2, 2, 18, 11);
        ctx.fillStyle = '#ffffff'; // White belly/neck
        ctx.fillRect(6, 9, 12, 4);
        ctx.fillRect(14, 5, 6, 8);
        ctx.fillStyle = '#d97706'; // Head
        ctx.fillRect(16, -2, 8, 8);
        
        // Ears
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(17, -6, 2, 4);
        ctx.fillRect(21, -6, 2, 4);
        ctx.fillStyle = '#ff79c6';
        ctx.fillRect(18, -4, 1, 2);
        ctx.fillRect(22, -4, 1, 2);
        
        // Face particulars
        ctx.fillStyle = '#000';
        ctx.fillRect(21, 0, 2, 2); // Eye
        ctx.fillRect(23, 2, 1, 1); // Nose
        
        let tailOffset = isLegUp ? -2 : 0;
        ctx.fillStyle = '#d97706';
        ctx.fillRect(-1, 1 + tailOffset, 3, 5); // Waggy tail
        
        ctx.fillStyle = '#78350f'; // Brown legs
        if (isLegUp) {
          ctx.fillRect(4, 13, 3, 3);
          ctx.fillRect(14, 11, 3, 2);
        } else {
          ctx.fillRect(4, 11, 3, 2);
          ctx.fillRect(14, 13, 3, 3);
        }
      }

      ctx.restore();
    }

    // Render Leash Owner walking ahead (Red cap, cyan shirt, denim pants)
    function drawOwner() {
      ctx.save();
      ctx.translate(ownerX, dogGroundY - 32);

      let ownerFrame = Math.floor(dogAnimFrame / 8) % 2 === 0 && ownerState === 'walk';

      // 1. Legs (Denim Blue)
      ctx.fillStyle = '#1e3a8a';
      if (ownerFrame) {
        ctx.fillRect(-2, 28, 4, 8);
        ctx.fillRect(4, 24, 4, 8);
      } else {
        ctx.fillRect(-2, 24, 4, 8);
        ctx.fillRect(4, 28, 4, 8);
      }
      
      // Shoes (White)
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ownerFrame ? -3 : -3, ownerFrame ? 34 : 30, 5, 2);
      ctx.fillRect(ownerFrame ? 3 : 3, ownerFrame ? 30 : 34, 5, 2);

      // 2. Torso (Cyan Shirt)
      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(-4, 8, 14, 20);

      // 3. Head (Beige skin)
      ctx.fillStyle = '#fed7aa';
      ctx.fillRect(0, -2, 8, 10);

      // Cap (Red cap)
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-1, -6, 11, 4); 
      ctx.fillRect(4, -4, 9, 2); // Cap visor

      // 4. Arms & Phone
      ctx.fillStyle = '#0891b2';
      if (ownerState === 'distracted') {
        ctx.fillRect(-8, 10, 5, 8); // Arm up
        ctx.fillStyle = '#00ffff'; // Glowing screen
        ctx.fillRect(-10, 6, 4, 4);
        
        // Exclamation Mark Balloon
        drawSpeechBubble();
      } else {
        ctx.fillRect(6, 12, 4, 10); // Swing arm
      }

      ctx.restore();
    }

    // Exclamation speech bubble above owner
    function drawSpeechBubble() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-2, -26, 16, 16);
      
      ctx.fillStyle = '#ef4444'; // Red glowing exclamation mark
      ctx.fillRect(5, -22, 2, 5);
      ctx.fillRect(5, -15, 2, 2);
    }

    // Obstacles: Neon spiked ball or hyper orange cat
    function drawObstacles() {
      obstacles.forEach(obs => {
        ctx.save();
        ctx.translate(obs.x, obs.y);

        if (obs.type === 'ball') {
          // Cyber spiked ball
          ctx.fillStyle = '#a855f7'; // Purple spiked center
          ctx.beginPath();
          ctx.arc(8, 8, 7, 0, Math.PI * 2);
          ctx.fill();
          
          // Outer spikes (Neon cyan)
          ctx.fillStyle = '#00f0ff';
          ctx.fillRect(6, 0, 4, 2);
          ctx.fillRect(6, 14, 4, 2);
          ctx.fillRect(0, 6, 2, 4);
          ctx.fillRect(14, 6, 2, 4);
        } else {
          // Orange Striped Cat running
          ctx.fillStyle = '#f97316';
          ctx.fillRect(0, 4, 16, 10); // body
          ctx.fillStyle = '#ffffff'; // cat details
          ctx.fillRect(10, 6, 6, 4);
          ctx.fillStyle = '#c2410c'; // stripes
          ctx.fillRect(4, 4, 2, 6);
          ctx.fillRect(8, 4, 2, 6);
          
          ctx.fillStyle = '#f97316'; // Head & ears
          ctx.fillRect(11, 0, 5, 6);
          ctx.fillRect(11, -3, 1, 3);
          ctx.fillRect(15, -3, 1, 3);
          
          ctx.fillStyle = '#f97316'; // Tail
          let catCycle = Math.floor(dogAnimFrame / 5) % 2 === 0;
          let tailY = catCycle ? -3 : 0;
          ctx.fillRect(0, 4 + tailY, 2, 4);

          // Legs
          ctx.fillStyle = '#c2410c';
          if (catCycle) {
            ctx.fillRect(2, 14, 2, 2);
            ctx.fillRect(12, 14, 2, 2);
          } else {
            ctx.fillRect(4, 14, 2, 2);
            ctx.fillRect(10, 14, 2, 2);
          }
        }

        ctx.restore();
      });
    }

    // Render chocolate brown round cartoon poops
    function drawPixelPoop(x, y) {
      ctx.fillStyle = '#78350f'; // Dark brown poop
      // Bottom layer
      ctx.fillRect(x - 5, y + 2, 10, 4);
      // Middle layer
      ctx.fillRect(x - 3, y - 1, 6, 3);
      // Top tier
      ctx.fillRect(x - 1, y - 3, 2, 2);

      // Gold neon aura glow
      ctx.fillStyle = 'rgba(255, 215, 0, 0.15)';
      ctx.fillRect(x - 6, y - 4, 12, 11);

      // Yellow vapor steam lines
      ctx.fillStyle = '#ffd700';
      let steamAnim = Math.floor(dogAnimFrame / 15) % 2 === 0;
      if (steamAnim) {
        ctx.fillRect(x - 2, y - 7, 1, 3);
        ctx.fillRect(x + 2, y - 9, 1, 3);
      } else {
        ctx.fillRect(x - 2, y - 9, 1, 3);
        ctx.fillRect(x + 2, y - 7, 1, 3);
      }
    }

    // Render Text Particles
    function drawTextParticles() {
      textParticles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.font = `bold ${p.size}px "Press Start 2P", Jua, sans-serif`;
        ctx.shadowBlur = 4;
        ctx.shadowColor = p.color;
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
      });
      ctx.globalAlpha = 1.0;
    }

    // Render top 8-bit HUD elements
    function drawHUD() {
      // Dark HUD Bar
      ctx.fillStyle = 'rgba(10, 13, 30, 0.6)';
      ctx.fillRect(0, 0, canvas.width, 32);
      ctx.fillStyle = 'rgba(0, 240, 255, 0.3)';
      ctx.fillRect(0, 31, canvas.width, 1);

      // Lives Hearts
      ctx.font = '12px sans-serif';
      let heartsText = '';
      for (let i = 0; i < lives; i++) heartsText += '❤️';
      ctx.fillText(heartsText, 12, 20);

      // Poop Count Icon
      ctx.font = '12px sans-serif';
      ctx.fillText('💩 ' + poopCount, 110, 20);

      // Score
      ctx.font = '7px "Press Start 2P", monospace';
      ctx.fillStyle = '#00f0ff';
      ctx.fillText('SCORE:' + String(score).padStart(4, '0'), 250, 18);
    }
  </script>
