    // ─── 2. THUMBNAIL MAPPING (Custom High-Res Banners Priority) ───
    const THUMB_MAP = {
      'kids-runner': 'kids-runner.gif',
      'sneaky-snacker': 'sneaky-snacker.gif',
      'fly-swat': 'fly-swat.gif',
      'gun-zombie': 'gun-zombie.gif',
      'fortress': '포트리스-게임베너-640-440.gif',
      'capybara-evolution': 'capybara-evolution.gif',
      'gian-game': '폭탄-640-440.gif',
      'pixel-tower': 'pixel-tower-게임베너-640-440.gif',
      'tetris': 'tetris.gif',
      '3drace': '3drace.gif',
      'cat-maze': 'cat-게임베너-640-440.gif',
      'space-survivor': 'space게임베너-640-440.gif',
      'galaxy': 'galaxy.gif',
      'poo': 'poo.gif'
    };

    function getThumbSrc(id) {
      return 'assets/thumbnails/' + (THUMB_MAP[id] || (id + '.gif'));
    }

    function handleThumbError(img, id) {
      if (!img.dataset.fallbackTried) {
        img.dataset.fallbackTried = '1';
        img.src = 'assets/thumbnails/' + id + '.gif';
      } else {
        img.src = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22640%22%20height%3D%22440%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20640%20440%22%3E%3Crect%20fill%3D%22%23f1f5f9%22%20width%3D%22640%22%20height%3D%22440%22%2F%3E%3Ctext%20fill%3D%22%2394a3b8%22%20font-family%3D%22sans-serif%22%20font-size%3D%2224%22%20font-weight%3D%22bold%22%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%20dy%3D%22.3em%22%3EPLAY%20GAME%3C%2Ftext%3E%3C%2Fsvg%3E';
      }
    }

    // ─── 3. TRANSLATIONS ───
    const TRANSLATIONS = {
      ko: {
        logo: '어답터 게임즈',
        headerBadge: '무료 웹게임',
        promoBadge: '오늘의 추천 게임',
        promoPlay: '지금 플레이하기',
        backToPortal: '목록으로',
        allGames: '전체 (14)',
        categoryAll: '전체',
        categoryAction: '액션',
        categoryArcade: '아케이드',
        categoryShooting: '슈팅',
        categoryPuzzle: '퍼즐',
        plays: '회 플레이',
        instantPlay: '즉시 실행'
      },
      en: {
        logo: 'Adopter Games',
        headerBadge: 'Free Games',
        promoBadge: "Today's Pick",
        promoPlay: 'Play Now',
        backToPortal: 'Back to List',
        allGames: 'All (14)',
        categoryAll: 'All',
        categoryAction: 'Action',
        categoryArcade: 'Arcade',
        categoryShooting: 'Shooting',
        categoryPuzzle: 'Puzzle',
        plays: ' plays',
        instantPlay: 'Play'
      }
    };

    // ─── 4. GLOBAL STATE ───
    let currentLang = 'ko';
    let currentCategory = 'all';

    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('adopter_game_lang');
      if (savedLang === 'ko' || savedLang === 'en') {
        currentLang = savedLang;
      }
      buildCategoryTabs();
      setupPromoBanner();
      renderGames();
      initCounters();

      // Check query parameter for direct play
      const urlParams = new URLSearchParams(window.location.search);
      const autoPlayId = urlParams.get('game');
      if (autoPlayId && GAMES_DATA[autoPlayId]) {
        setTimeout(() => { launchGameDirect(autoPlayId); }, 300);
      }
    });

    function initCounters() {
      let totalPlays = localStorage.getItem('adopter_total_plays');
      if (!totalPlays) {
        totalPlays = 142500 + Math.floor(Math.random() * 800);
        localStorage.setItem('adopter_total_plays', totalPlays);
      }
      document.getElementById('valTotalPlays').textContent = formatNum(totalPlays);
    }

    function formatNum(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    // ─── 5. CATEGORIES TABS ───
    function buildCategoryTabs() {
      const tabsEl = document.getElementById('categoryTabs');
      const cats = [
        { id: 'all', key: 'categoryAll' },
        { id: 'action', key: 'categoryAction' },
        { id: 'arcade', key: 'categoryArcade' },
        { id: 'shooting', key: 'categoryShooting' },
        { id: 'puzzle', key: 'categoryPuzzle' }
      ];

      tabsEl.innerHTML = cats.map(c => {
        const isActive = currentCategory === c.id;
        const activeClass = isActive ? 'cat-btn-active' : 'bg-white text-slate-700 hover:bg-slate-100 border-slate-200';
        return `
          <button onclick="selectCategory('${c.id}')" class="px-3.5 py-1.5 rounded-xl border text-xs sm:text-sm font-semibold transition whitespace-nowrap ${activeClass}">
            ${TRANSLATIONS[currentLang][c.key]}
          </button>
        `;
      }).join('');
    }

    function selectCategory(catId) {
      currentCategory = catId;
      buildCategoryTabs();
      renderGames();
    }

    // ─── 6. PROMO FEATURED BANNER ───
    function setupPromoBanner() {
      // 1번 런닝맨을 기본 추천 피처드로 우선 노출
      const featuredList = ['kids-runner', 'sneaky-snacker', 'fortress', 'gian-game', '3drace'];
      const randomId = featuredList[Math.floor(Math.random() * featuredList.length)];
      const g = GAMES_DATA[randomId];
      const banner = document.getElementById('promoCard');
      banner.dataset.featuredGameId = randomId;

      document.getElementById('promoTitle').textContent = g[currentLang].title;
      document.getElementById('promoDesc').textContent = g[currentLang].desc;

      const thumb = getThumbSrc(randomId);
      document.getElementById('promoPreviewBox').innerHTML = `
        <img src="${thumb}" alt="${g[currentLang].title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="handleThumbError(this, '${randomId}')">
      `;
    }

    function launchFeaturedGame() {
      const banner = document.getElementById('promoCard');
      const id = banner.dataset.featuredGameId || 'kids-runner';
      launchGameDirect(id);
    }

    // ─── 7. RENDER GAMES GRID ───
    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      const query = (document.getElementById('searchInput')?.value || document.getElementById('searchInputMobile')?.value || '').toLowerCase().trim();

      let html = '';
      let matchCount = 0;

      Object.keys(GAMES_DATA).forEach(id => {
        const game = GAMES_DATA[id];
        const title = game[currentLang].title;
        const desc = game[currentLang].desc;
        const catKey = 'category' + game.cat.charAt(0).toUpperCase() + game.cat.slice(1);
        const catName = TRANSLATIONS[currentLang][catKey] || game.cat;

        if (currentCategory !== 'all' && game.cat !== currentCategory) return;
        if (query && !title.toLowerCase().includes(query) && !desc.toLowerCase().includes(query)) return;

        matchCount++;
        const plays = localStorage.getItem(`spark_plays_${id}`) || game.clicksSeed;
        const formattedPlays = formatNum(plays);

        // Subtle, refined badge (no childish rainbow)
        let badgeHtml = '';
        if (game.badge === 'best') {
          badgeHtml = `<span class="absolute top-2.5 left-2.5 px-2 py-0.5 rounded-md bg-blue-600/90 text-white font-bold text-[10px] shadow-xs">베스트</span>`;
        } else if (game.badge === 'hot') {
          badgeHtml = `<span class="absolute top-2.5 left-2.5 px-2 py-0.5 rounded-md bg-rose-600/90 text-white font-bold text-[10px] shadow-xs">인기</span>`;
        } else if (game.badge === 'new') {
          badgeHtml = `<span class="absolute top-2.5 left-2.5 px-2 py-0.5 rounded-md bg-emerald-600/90 text-white font-bold text-[10px] shadow-xs">신규</span>`;
        }

        const thumbUrl = getThumbSrc(id);

        html += `
          <div class="group bg-white border border-slate-200/90 hover:border-slate-300 rounded-2xl overflow-hidden shadow-xs hover:shadow-md transition-all duration-200 flex flex-col cursor-pointer transform hover:-translate-y-1" onclick="launchGameDirect('${id}')">
            
            <!-- Thumbnail Image -->
            <div class="relative aspect-[16/11] overflow-hidden bg-slate-100">
              <img src="${thumbUrl}" class="w-full h-full object-cover group-hover:scale-103 transition duration-300" onerror="handleThumbError(this, '${id}')" alt="${title}" loading="lazy">
              ${badgeHtml}
              <div class="absolute inset-0 bg-slate-900/0 group-hover:bg-slate-900/10 transition-colors flex items-center justify-center">
                <span class="opacity-0 group-hover:opacity-100 transition-opacity transform translate-y-1 group-hover:translate-y-0 px-3 py-1.5 rounded-lg bg-white/95 text-slate-900 font-bold text-xs shadow-md flex items-center gap-1.5">
                  <svg class="w-3.5 h-3.5 text-brand-600 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                  플레이
                </span>
              </div>
            </div>

            <!-- Card Details -->
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between text-xs text-slate-500 font-medium mb-1.5">
                  <span class="text-brand-600 font-semibold">${catName}</span>
                  <span>${formattedPlays}${TRANSLATIONS[currentLang].plays}</span>
                </div>
                <h3 class="text-sm sm:text-base font-bold text-slate-900 group-hover:text-brand-600 transition-colors mb-1.5 line-clamp-1">${title}</h3>
                <p class="text-xs text-slate-500 leading-relaxed line-clamp-2">${desc}</p>
              </div>
              <div class="mt-3.5 pt-2.5 border-t border-slate-100 flex items-center justify-between text-xs font-semibold text-slate-600 group-hover:text-brand-600">
                <span>${TRANSLATIONS[currentLang].instantPlay}</span>
                <svg class="w-3.5 h-3.5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
              </div>
            </div>

          </div>
        `;
      });

      grid.innerHTML = html || `<div class="col-span-full py-16 text-center text-slate-400 text-sm">검색 결과가 없습니다.</div>`;
      document.getElementById('filteredCountText').textContent = `${matchCount}개 게임 표시 중`;
    }

    function filterGames() {
      renderGames();
    }

    function syncMobileSearch(val) {
      const desktop = document.getElementById('searchInput');
      if (desktop) desktop.value = val;
      renderGames();
    }

    // ─── 8. GAME OVERLAY / IFRAME PLAYER ───
    function launchGameDirect(gameId) {
      const game = GAMES_DATA[gameId];
      if (!game) return;

      // Increment click tracking
      let plays = localStorage.getItem(`spark_plays_${gameId}`) || game.clicksSeed;
      plays = parseInt(plays) + 1;
      localStorage.setItem(`spark_plays_${gameId}`, plays);

      // Set Overlay Title
      document.getElementById('headerGameTitle').textContent = game[currentLang].title;

      // Show overlay
      const overlay = document.getElementById('gamePlayOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      document.body.style.overflow = 'hidden';

      // Load Iframe immediately
      const iframe = document.getElementById('gameIframe');
      iframe.src = game.path;

      // Save ID for sharing
      overlay.dataset.currentGameId = gameId;
    }

    function closeGameFrame() {
      const overlay = document.getElementById('gamePlayOverlay');
      overlay.classList.remove('flex');
      overlay.classList.add('hidden');
      document.body.style.overflow = '';

      const iframe = document.getElementById('gameIframe');
      iframe.src = '';

      renderGames();
    }

    function reloadGameFrame() {
      const iframe = document.getElementById('gameIframe');
      const src = iframe.src;
      iframe.src = '';
      setTimeout(() => { iframe.src = src; }, 50);
    }

    function openGameInNewTab() {
      const iframe = document.getElementById('gameIframe');
      if (iframe.src) {
        window.open(iframe.src, '_blank');
      }
    }

    // ─── 9. SHARE UTILS ───
    function sharePortal() {
      const url = window.location.href.split('?')[0];
      const title = '어답터 게임즈 - 100% 무료 무설치 웹게임 놀이터';
      if (navigator.share) {
        navigator.share({ title: title, text: '설치 없이 브라우저에서 바로 즐기는 무료 웹게임 놀이터!', url: url }).catch(() => copyToClipboard(url));
      } else {
        copyToClipboard(url);
      }
    }

    function shareCurrentGame() {
      const overlay = document.getElementById('gamePlayOverlay');
      const id = overlay.dataset.currentGameId;
      if (!id || !GAMES_DATA[id]) return;
      const url = `${window.location.href.split('?')[0]}?game=${id}`;
      const title = `${GAMES_DATA[id][currentLang].title} - 어답터 게임즈`;
      if (navigator.share) {
        navigator.share({ title: title, text: GAMES_DATA[id][currentLang].desc, url: url }).catch(() => copyToClipboard(url));
      } else {
        copyToClipboard(url);
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('링크가 복사되었습니다!');
      }).catch(() => {
        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = text;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        alert('링크가 복사되었습니다!');
      });
    }

    // ─── 10. LANGUAGE SWAP ───
    function switchLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('adopter_game_lang', lang);

      document.getElementById('btnKo').className = lang === 'ko' ? 'px-2.5 py-1 rounded-md transition text-slate-900 bg-white shadow-xs font-bold' : 'px-2.5 py-1 rounded-md transition text-slate-500 hover:text-slate-900';
      document.getElementById('btnEn').className = lang === 'en' ? 'px-2.5 py-1 rounded-md transition text-slate-900 bg-white shadow-xs font-bold' : 'px-2.5 py-1 rounded-md transition text-slate-500 hover:text-slate-900';

      const d = TRANSLATIONS[lang];
      document.getElementById('langLogo').textContent = d.logo;
      document.getElementById('langHeaderBadge').textContent = d.headerBadge;
      document.getElementById('langPromoBadge').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-brand-600 animate-pulse"></span>${d.promoBadge}`;
      document.getElementById('langPromoPlay').querySelector('span').textContent = d.promoPlay;
      document.getElementById('langBackToPortal').textContent = d.backToPortal;

      buildCategoryTabs();
      renderGames();

      const banner = document.getElementById('promoCard');
      const featuredId = banner.dataset.featuredGameId;
      if (featuredId && GAMES_DATA[featuredId]) {
        document.getElementById('promoTitle').textContent = GAMES_DATA[featuredId][currentLang].title;
        document.getElementById('promoDesc').textContent = GAMES_DATA[featuredId][currentLang].desc;
      }
    }
  </script>
