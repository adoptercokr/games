<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🍪 쿠키 대탈주</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a001e}
#gw{
  position:absolute;
  width:480px;height:854px;
  transform-origin:top left;
}
canvas{position:absolute;top:0;left:0;width:480px;height:854px;display:block}
#ov{position:absolute;top:0;left:0;width:480px;height:854px;pointer-events:none}

/* ── Panels ── */
.panel{
  position:absolute;top:0;left:0;width:480px;height:854px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:all;
}
.hidden{display:none!important}

/* MENU */
#pMenu{background:linear-gradient(180deg,#0a001e 0%,#250050 55%,#c84010 85%,#90300a 100%)}
.title{font:900 48px/1 'Segoe UI',sans-serif;color:#FFD700;
  text-shadow:0 0 24px #ff6600,0 5px 0 #880000;letter-spacing:3px;
  animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-12px)}}
.sub{font:700 14px/1 'Segoe UI',sans-serif;color:#ffb347;letter-spacing:5px;margin:8px 0 30px}
.mbtn{
  display:block;padding:14px 50px;border:none;border-radius:50px;
  font:700 18px/1 'Segoe UI',sans-serif;cursor:pointer;margin:6px;
  letter-spacing:1px;transition:transform .12s;
}
.mbtn:active{transform:scale(.93)!important}
.bplay{background:linear-gradient(135deg,#FFD700,#ff6600);color:#3d0000;
  font-size:22px;padding:18px 70px;box-shadow:0 4px 24px rgba(255,130,0,.7)}
.bplay:hover{transform:scale(1.06)}
.bchar{background:linear-gradient(135deg,#a855f7,#6366f1);color:#fff}
.bshop{background:linear-gradient(135deg,#22d3ee,#0ea5e9);color:#fff}
.info{font-size:14px;color:#FFD700;margin-top:10px;opacity:.9}

/* CHAR SELECT */
#pChar,#pShop{background:rgba(10,0,30,.95)}
.stitle{font:900 24px/1 'Segoe UI',sans-serif;color:#FFD700;
  margin-bottom:16px;text-shadow:0 0 10px #ff6600}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px;width:340px}
.cc{
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);
  border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;
  transition:border-color .2s,background .2s;position:relative;
}
.cc.sel{border-color:#FFD700;background:rgba(255,215,0,.18);box-shadow:0 0 14px rgba(255,215,0,.4)}
.cc.lk{opacity:.5}
.ci{font-size:36px;display:block}
.cn{font-size:11px;color:#fff;font-weight:700;margin-top:3px}
.cd{font-size:9px;color:#bbb;margin-top:2px}
.cp{font-size:11px;color:#FFD700;margin-top:4px}
.lki{position:absolute;top:4px;right:5px;font-size:12px}

/* SHOP */
.slist{display:flex;flex-direction:column;gap:10px;width:360px;padding:4px}
.si{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.sic{font-size:30px}
.sinf{flex:1}
.sn{color:#fff;font:700 14px/1 'Segoe UI',sans-serif}
.sd{color:#aaa;font-size:11px;margin-top:2px}
.bbuy{
  background:linear-gradient(135deg,#FFD700,#ff6600);border:none;
  border-radius:20px;padding:6px 14px;color:#3d0000;font:700 12px/1 'Segoe UI',sans-serif;cursor:pointer;
}
.bbuy:disabled{opacity:.35;cursor:default}
.bback{background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:20px;
  padding:8px 24px;cursor:pointer;margin-top:16px;font-size:14px}

/* HUD */
#hud{
  position:absolute;top:0;left:0;width:480px;
  padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;
}
.hudl .sc{font:900 22px/1 'Segoe UI',sans-serif;color:#FFD700;text-shadow:0 2px 4px rgba(0,0,0,.8)}
.hudl .lv{display:flex;gap:4px;margin-top:5px;font-size:16px}
.hudr{text-align:right}
.hudr .bt{color:rgba(255,215,0,.65);font-size:11px}
.hudr .hc{color:#FFD700;font-size:13px;margin-top:3px}
#ibar{
  position:absolute;bottom:88px;left:0;width:480px;
  display:flex;justify-content:center;gap:8px;pointer-events:none;
}
.ich{
  background:rgba(0,0,0,.7);border:2px solid rgba(255,255,255,.3);
  border-radius:10px;padding:4px 10px;color:#fff;font-size:12px;
  display:flex;align-items:center;gap:4px;
}
.ict{font-size:10px;color:#FFD700}

/* MOBILE CONTROLS */
#mc{
  position:absolute;bottom:10px;left:0;width:480px;
  display:flex;justify-content:space-between;padding:0 20px;
  pointer-events:all;
}
.cb{
  width:72px;height:72px;border-radius:50%;font-size:26px;
  background:rgba(255,255,255,.13);border:2.5px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;
}
.cb:active{background:rgba(255,255,255,.35)}

/* GAMEOVER */
#pGO{background:rgba(0,0,0,.85);backdrop-filter:blur(10px)}
.got{font:900 44px/1 'Segoe UI',sans-serif;color:#ff3333;text-shadow:0 0 20px #ff0000;
  margin-bottom:16px;animation:shk .5s ease-in-out}
@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.gos{font-size:30px;color:#FFD700;font-weight:900;margin-bottom:4px}
.gosub{font-size:15px;color:#ffb347;margin-bottom:4px}
.gonew{color:#00ff88;font:700 16px/1 'Segoe UI',sans-serif;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.gobtns{display:flex;flex-direction:column;align-items:center;margin-top:18px;gap:8px}
</style>
</head>
<body>
<div id="gw">
  <canvas id="c" width="480" height="854"></canvas>
  <div id="ov">

    <div id="pMenu" class="panel">
      <div class="title">🍪 쿠키 대탈주</div>
      <div class="sub">COOKIE ESCAPE!</div>
      <button class="mbtn bplay" id="bPlay">▶ 게임 시작!</button>
      <button class="mbtn bchar" id="bChar">🍪 캐릭터 선택</button>
      <button class="mbtn bshop" id="bShop">🛒 상점</button>
      <div class="info">🏆 최고: <span id="mBest">0</span>점 &nbsp;|&nbsp; 💰 <span id="mCoins">0</span></div>
    </div>

    <div id="pChar" class="panel hidden">
      <div class="stitle">🍪 캐릭터 선택</div>
      <div class="cgrid" id="cgrid"></div>
      <button class="bback" id="bCharBack">← 뒤로</button>
    </div>

    <div id="pShop" class="panel hidden">
      <div class="stitle">🛒 상점</div>
      <div class="info" id="shopCoin" style="margin-bottom:10px"></div>
      <div class="slist" id="slist"></div>
      <button class="bback" id="bShopBack">← 뒤로</button>
    </div>

    <div id="hud" class="hidden">
      <div class="hudl">
        <div class="sc">⭐ <span id="hsc">0</span></div>
        <div class="lv" id="hlv"></div>
      </div>
      <div class="hudr">
        <div class="bt">🏆 <span id="hbt">0</span></div>
        <div class="hc">💰 <span id="hco">0</span></div>
      </div>
    </div>
    <div id="ibar" class="hidden"></div>

    <div id="mc" class="hidden">
      <div class="cb" id="cj">🦘</div>
      <div class="cb" id="cs">👇</div>
    </div>

    <div id="pGO" class="panel hidden">
      <div class="got">💀 게임 오버</div>
      <div class="gos">⭐ <span id="goSc">0</span>점</div>
      <div class="gosub">🏆 최고: <span id="goBt">0</span>점</div>
      <div class="gosub">💰 +<span id="goCo">0</span> 금화 획득!</div>
      <div class="gonew hidden" id="goNew">🎉 신기록 달성!</div>
      <div class="gobtns">
        <button class="mbtn bplay" id="bRetry">🔄 다시 도전!</button>
        <button class="mbtn bchar" id="bGOMenu">🏠 메뉴로</button>
      </div>
    </div>

  </div>
</div>

<script>
// ── LAYOUT ────────────────────────────────────────────────────
const gw = document.getElementById('gw');
const W = 480, H = 854;
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const tx = (window.innerWidth  - W * s) / 2;
  const ty = (window.innerHeight - H * s) / 2;
  gw.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}
window.addEventListener('resize', resize);
resize();

// ── CANVAS ────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const GY     = H - 120; 

// ── DATA ──────────────────────────────────────────────────────
const CHARS = [
  {id:'cookie',    name:'쿠키 용사', icon:'🍪', desc:'기본형',      col:'#f4a261', price:0,   ab:'none'},
  {id:'strawberry',name:'딸기 쿠키', icon:'🍓', desc:'점프력 ↑',   col:'#e63946', price:100, ab:'jump'},
  {id:'choco',     name:'초코 쿠키', icon:'🍫', desc:'점수 +10%',  col:'#6d4c41', price:150, ab:'score'},
  {id:'cupcake',   name:'컵케이크',  icon:'🧁', desc:'자석 효과',  col:'#f48fb1', price:200, ab:'magnet'},
  {id:'moon',      name:'달빛 쿠키', icon:'🌙', desc:'슬라이드 무적',col:'#7986cb',price:250, ab:'slide'},
  {id:'rainbow',   name:'레인보우',  icon:'🌈', desc:'전능형',     col:'#ab47bc', price:500, ab:'all'},
];
const PERKS = [
  {id:'extra_life', name:'생명력 +1',  icon:'❤️', desc:'시작 시 하트 4개', price:80},
  {id:'score_2x',   name:'점수 2배',   icon:'⭐', desc:'점수 획득 2배',    price:120},
  {id:'mperk',      name:'영구 자석',  icon:'🧲', desc:'아이템 자동 흡수', price:200},
];

// ── SAVE (안전하게 수정됨) ──────────────────────────────────
let sv = {best:0, coins:0, sel:'cookie', owned:['cookie'], perks:[]};
function ld() {
  try { 
    const d = JSON.parse(localStorage.getItem('cke_fix') || '{}');
    if(d.best)  sv.best  = d.best;
    if(d.coins) sv.coins = d.coins;
    if(d.sel)   sv.sel   = d.sel;
    if(d.owned) sv.owned = d.owned;
    if(d.perks) sv.perks = d.perks;
  } catch(e) { console.warn('로컬 파일에서는 저장 기능이 제한될 수 있습니다.'); }
}
function sd() { 
  try {
    localStorage.setItem('cke_fix', JSON.stringify(sv)); 
  } catch(e) {}
}
ld();

// ── GAME STATE ─────────────────────────────────────
let mode = 'menu'; 
let score=0, lives=3, speed=4, fr=0, crun=0, oT=0, iT=0, sT=0, dT=0;
let ai = {shield:0, magnet:0, rocket:0, slow:0}; 
let inv = 0;
let shake=0;

const P = {x:80, y:GY, w:56, h:56, vy:0, jmp:false, sl:false, slt:0, af:0, aft:0};
let OBS=[], ITMS=[], PARTS=[], CLDS=[], bgx=0;

function ch() { return CHARS.find(c=>c.id===sv.sel)||CHARS[0]; }
function hp(id) { return sv.perks.includes(id); }

// ── INIT ──────────────────────────────────────────────────────
function startGame() {
  score=0; crun=0; fr=0; oT=0; iT=0; sT=0; dT=0;
  speed=4; inv=0;
  ai={shield:0, magnet:0, rocket:0, slow:0};
  lives=hp('extra_life')?4:3;
  P.x=80; P.y=GY-56; P.w=56; P.h=56;
  P.vy=0; P.jmp=false; P.sl=false; P.slt=0; P.af=0; P.aft=0;
  OBS=[]; ITMS=[]; PARTS=[]; bgx=0;
  CLDS=Array.from({length:6},()=>({
    x:Math.random()*W, y:30+Math.random()*100,
    w:60+Math.random()*90, h:24+Math.random()*18,
    a:0.2+Math.random()*0.3, sp:0.5+Math.random()
  }));
  mode='play';
  show(null);
  ['hud','ibar','mc'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
  updLives();
  document.getElementById('hbt').textContent = sv.best;
  document.getElementById('hco').textContent = sv.coins;
  document.getElementById('hsc').textContent = 0;
}

// ── INPUT ─────────────────────────────────────────────────────
function jump() {
  if(mode!=='play') return;
  const boost=(ch().ab==='jump'||ch().ab==='all')?1.2:1;
  if(!P.jmp){P.vy=-15*boost;P.jmp=true;burst(P.x+28,P.y+56,'#fff9c4',5);}
  else if(P.vy>-4){P.vy=-10*boost;}
}
function slide() {
  if(mode!=='play'||P.sl) return;
  P.sl=true; P.slt=45; P.h=28; P.y+=28;
  if(P.jmp) P.vy=6;
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();jump();}
  if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='ShiftLeft'){e.preventDefault();slide();}
});

let ty0=0;
canvas.addEventListener('touchstart',e=>{e.preventDefault();ty0=e.touches[0].clientY;},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  const dy=ty0-e.changedTouches[0].clientY;
  if(dy>20)jump();else if(dy<-20)slide();else jump();
},{passive:false});
canvas.addEventListener('click',jump);
document.getElementById('cj').addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});
document.getElementById('cs').addEventListener('touchstart',e=>{e.preventDefault();slide();},{passive:false});
document.getElementById('cj').addEventListener('mousedown',jump);
document.getElementById('cs').addEventListener('mousedown',slide);

// ── SPAWN ─────────────────────────────────────────────────────
function spawnObs() {
  const T=['rock','cactus','eagle','fire','mushroom'];
  const W2=[3,3,2,2,1]; let r=Math.random()*11,t='rock',a=0;
  for(let i=0;i<T.length;i++){a+=W2[i];if(r<a){t=T[i];break;}}
  const o={type:t,x:W+20};
  if(t==='rock')     {o.w=50;o.h=50;o.y=GY-50;}
  else if(t==='cactus')  {o.w=36;o.h=70;o.y=GY-70;}
  else if(t==='eagle')   {o.w=60;o.h=40;o.y=GY-85-Math.random()*15;}
  else if(t==='fire')    {o.w=40;o.h=80;o.y=GY-80;}
  else if(t==='mushroom'){o.w=52;o.h=60;o.y=GY-60;}
  OBS.push(o);
}
function spawnItem() {
  const pool=['coin','coin','coin','star','shield','magnet','rocket','slow'];
  const t=pool[Math.floor(Math.random()*pool.length)];
  ITMS.push({type:t,x:W+10,y:Math.random()<0.3?GY-130:GY-52,w:26,h:26});
}
function burst(x,y,col,n){
  for(let i=0;i<n;i++)
    PARTS.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-2)*5,col,life:1,r:Math.random()*6+3});
}

// ── DRAW BG ───────────────────────────────────────────────────
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a001e'); g.addColorStop(0.55,'#260058');
  g.addColorStop(0.78,'#d05018'); g.addColorStop(1,'#8a2e08');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const t=Date.now()*0.001;
  for(let i=0;i<32;i++){
    const sx=((i*139-bgx*0.04)%W+W)%W;
    const sy=(i*97)%(H*0.5);
    const ss=Math.sin(t+i)*0.5+1;
    ctx.fillStyle='rgba(255,255,255,0.8)';
    ctx.beginPath();ctx.arc(sx,sy,ss,0,Math.PI*2);ctx.fill();
  }
  CLDS.forEach(c=>{
    ctx.fillStyle=`rgba(255,190,140,${c.a})`;
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.w,c.h,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x-c.w*0.4,c.y+5,c.w*0.6,c.h*0.65,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x+c.w*0.4,c.y+5,c.w*0.6,c.h*0.65,0,0,Math.PI*2);ctx.fill();
  });
  const gg=ctx.createLinearGradient(0,GY,0,H);
  gg.addColorStop(0,'#9b5523'); gg.addColorStop(0.3,'#6b3410'); gg.addColorStop(1,'#3a1a05');
  ctx.fillStyle=gg; ctx.fillRect(0,GY+2,W,H-GY);
  ctx.fillStyle='#a8602c'; ctx.fillRect(0,GY,W,12);
  ctx.fillStyle='#d4804a'; ctx.fillRect(0,GY,W,4);
  ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1;
  const tw=60, off=((bgx)%tw+tw)%tw;
  for(let tx=W-off;tx<W+tw;tx-=tw){
    ctx.beginPath();ctx.moveTo(W-tx,GY);ctx.lineTo(W-tx,GY+12);ctx.stroke();
  }
}

// ── DRAW PLAYER ───────────────────────────────────────────────
function drawChar(px,py,pw,ph,charId,anim,sliding){
  const c=CHARS.find(c=>c.id===charId)||CHARS[0];
  const col=c.col;
  ctx.save();
  ctx.translate(px+pw/2, py+ph/2);

  if(sliding){
    ctx.fillStyle=col;
    ctx.beginPath();ctx.ellipse(0,0,pw*0.5,ph*0.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff8e1';
    ctx.beginPath();ctx.ellipse(-pw*0.15,0,pw*0.17,ph*0.38,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.arc(-pw*0.15-4,0,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(-pw*0.15+4,0,3,0,Math.PI*2);ctx.fill();
  } else {
    const lOff=Math.sin(anim*0.8)*9;
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(0,ph*0.42,pw*0.35,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=col;
    ctx.fillRect(-pw*0.25,ph*0.15,pw*0.2,ph*0.28+lOff);
    ctx.fillRect( pw*0.05,ph*0.15,pw*0.2,ph*0.28-lOff);
    
    ctx.fillRect(-pw*0.4,-ph*0.32,pw*0.8,ph*0.6); 
    
    ctx.fillStyle='rgba(255,255,255,0.22)';
    ctx.fillRect(-pw*0.25,-ph*0.08,pw*0.5,ph*0.3);
    
    ctx.fillStyle='#fff8e1';
    ctx.beginPath();ctx.ellipse(0,-ph*0.08,pw*0.28,ph*0.3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.arc(-7,-ph*0.12,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( 7,-ph*0.12,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-6,-ph*0.14,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc( 8,-ph*0.14,1.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#c0392b';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,-ph*0.03,6,0.2,Math.PI-0.2);ctx.stroke();
    
    if(charId==='strawberry'){ctx.fillStyle='#e63946';ctx.fillRect(-8,-ph*0.44,16,8);}
    if(charId==='choco'){ctx.fillStyle='#3e220a';ctx.fillRect(-pw*0.35,-ph*0.42,pw*0.7,12);}
    if(charId==='moon'){ctx.fillStyle='#7986cb';ctx.beginPath();ctx.arc(0,-ph*0.42,10,0,Math.PI*2);ctx.fill();}
    if(charId==='cupcake'){ctx.fillStyle='#f8bbd0';ctx.fillRect(-pw*0.3,-ph*0.45,pw*0.6,16);}
    if(charId==='rainbow'){
      const rg=ctx.createLinearGradient(-pw/2,-ph/2,pw/2,ph/2);
      ['#ff0','#f0f','#0ff','#0f0','#f60'].forEach((cl,i)=>rg.addColorStop(i/4,cl));
      ctx.fillStyle=rg;
      ctx.fillRect(-pw*0.4,-ph*0.32,pw*0.8,ph*0.6);
    }
  }
  ctx.restore();
}

// ── DRAW OBSTACLES ────────────────────────────────────────────
function drawObs(){
  OBS.forEach(o=>{
    ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);
    const t=Date.now()*0.005;
    if(o.type==='rock'){
      ctx.fillStyle='#78909c';ctx.beginPath();ctx.ellipse(0,0,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#b0bec5';ctx.beginPath();ctx.ellipse(-o.w*0.15,-o.h*0.2,o.w*0.2,o.h*0.15,-0.3,0,Math.PI*2);ctx.fill();
    }else if(o.type==='cactus'){
      ctx.fillStyle='#2e7d32';
      ctx.fillRect(-o.w/4,-o.h/2,o.w/2,o.h);
      ctx.fillRect(-o.w/2,-o.h*0.12,o.w*0.35,o.h*0.35);
      ctx.fillRect( o.w*0.15,-o.h*0.22,o.w*0.35,o.h*0.3);
    }else if(o.type==='eagle'){
      const fl=Math.sin(Date.now()*0.012)*16;
      ctx.fillStyle='#5d4037';ctx.beginPath();ctx.ellipse(0,0,o.w/2,o.h/3,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#795548';
      ctx.beginPath();ctx.ellipse(-o.w*0.4,-o.h*0.1+fl,o.w*0.35,o.h*0.25,-0.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse( o.w*0.4,-o.h*0.1-fl,o.w*0.35,o.h*0.25, 0.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffa000';ctx.beginPath();ctx.moveTo(o.w*0.3,-2);ctx.lineTo(o.w*0.52,0);ctx.lineTo(o.w*0.3,2);ctx.closePath();ctx.fill();
    }else if(o.type==='fire'){
      for(let i=0;i<3;i++){
        const grad=ctx.createRadialGradient(0,0,1,0,0,Math.max(1, o.w*0.6));
        grad.addColorStop(0,'#fff176');grad.addColorStop(0.4,'#ff9800');grad.addColorStop(1,'rgba(244,67,54,0)');
        ctx.fillStyle=grad;
        ctx.beginPath();
        ctx.moveTo(0,o.h*0.5);
        ctx.quadraticCurveTo(Math.sin(t+i*2)*o.w*0.4,-o.h*0.3,Math.cos(t+i*2)*o.w*0.2,-o.h*0.5);
        ctx.quadraticCurveTo(-Math.sin(t+i*2)*o.w*0.4,-o.h*0.3,0,o.h*0.5);
        ctx.fill();
      }
    }else if(o.type==='mushroom'){
      ctx.fillStyle='#e53935';ctx.beginPath();ctx.arc(0,-o.h*0.1,o.w/2,Math.PI,0);ctx.fill();
      [[-8,-10],[6,-6],[0,-16]].forEach(([cx,cy])=>{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();});
      ctx.fillStyle='#f5f5dc';ctx.fillRect(-o.w*0.2,-o.h*0.1,o.w*0.4,o.h*0.5);
    }
    ctx.restore();
  });
}

// ── DRAW ITEMS ────────────────────────────────────────────────
function drawItems(){
  const em={coin:'💰',star:'⭐',shield:'🛡️',rocket:'🚀',magnet:'🧲',slow:'⏰'};
  ITMS.forEach(it=>{
    ctx.save();
    ctx.translate(it.x+13, it.y+13+Math.sin(Date.now()*0.01 + it.x*0.1)*8);
    ctx.font='24px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(em[it.type]||'⭐',0,0);
    ctx.restore();
  });
}

// ── DRAW PARTICLES ────────────────────────────────────────────
function drawParts(){
  PARTS=PARTS.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life-=0.04;
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
    return p.life>0;
  });
  ctx.globalAlpha=1;
}

// ── UPDATE (문법 오류 수정됨) ────────────────────────────────────────────────────
function update(){
  fr++;
  const slow = ai.slow > 0, rkt = ai.rocket > 0;
  // ★ 치명적인 오류 원인 수정 완료: (slow ? 0.5 : 1) 로 띄어쓰기 명확히 함
  const spd = (rkt ? speed * 1.5 : speed) * (slow ? 0.5 : 1);

  P.aft++; if(P.aft>5){P.af=(P.af+1)%4;P.aft=0;}

  P.vy+=0.55; P.y+=P.vy;
  const gl = GY - P.h;
  if(P.y>=gl){P.y=gl;P.vy=0;P.jmp=false;}
  else {P.jmp=true;}

  if(P.sl){P.slt--;if(P.slt<=0){P.sl=false;P.h=56;P.y-=28;}}

  Object.keys(ai).forEach(k=>{if(ai[k]>0)ai[k]--;});
  if(inv>0)inv--;

  dT++;if(dT%600===0&&speed<12)speed+=0.5;

  sT++;
  if(sT%6===0){
    const m=hp('score_2x')?2:1;
    const cb=(ch().ab==='score'||ch().ab==='all')?1.1:1;
    score+=Math.floor(m*cb);
    document.getElementById('hsc').textContent=score;
  }

  const gap=Math.max(55,90-speed*5);
  oT++;if(oT>gap+Math.random()*60){spawnObs();oT=0;}
  iT++;if(iT>80+Math.random()*90){spawnItem();iT=0;}

  const px=P.x+8,pw=P.w-16,pH=P.sl?P.h/2:P.h,pt=P.y;
  const invc=inv>0||ai.shield>0||rkt;
  const slim=ch().ab==='slide'&&P.sl;
  const mag=ai.magnet>0||hp('mperk')||ch().ab==='magnet'||ch().ab==='all';

  OBS=OBS.filter(o=>{
    o.x-=spd;
    if(o.x+o.w<0)return false;
    if(!invc&&!slim){
      if(px<o.x+o.w-5&&px+pw>o.x+5&&pt<o.y+o.h-5&&pt+pH>o.y+5){onHit();return false;}
    }
    return true;
  });

  ITMS=ITMS.filter(it=>{
    if(mag){
      const dx=P.x+P.w/2-(it.x+13),dy=P.y+P.h/2-(it.y+13);
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<160){it.x+=dx*0.12;it.y+=dy*0.12;}
    }
    it.x-=spd;
    if(it.x+it.w<0)return false;
    if(px<it.x+it.w&&px+pw>it.x&&pt<it.y+it.h&&pt+pH>it.y+5){onCollect(it);return false;}
    return true;
  });

  bgx+=spd*0.5;
  CLDS.forEach(c=>{
    // ★ 여기도 문법 오류 원인 수정
    c.x -= c.sp * (slow ? 0.5 : 1);
    if(c.x<-c.w*2) c.x=W+c.w;
  });
  updItemBar();
}

function onHit(){
  burst(P.x+28,P.y+28,'#ff4444',20);
  shake=15;
  lives--;inv=120;updLives();
  if(lives<=0){mode='dead';setTimeout(doGameOver,600);}
}
function onCollect(it){
  const cols={coin:'#FFD700',star:'#fff176',shield:'#4fc3f7',rocket:'#ff9800',magnet:'#a5d6a7',slow:'#ce93d8'};
  burst(it.x+13,it.y+13,cols[it.type]||'#fff',8);
  const m=hp('score_2x')?2:1;
  if(it.type==='coin'){crun++;sv.coins++;document.getElementById('hco').textContent=sv.coins;}
  else if(it.type==='star'){score+=50*m;document.getElementById('hsc').textContent=score;}
  else if(it.type==='shield'){ai.shield=300;inv=300;}
  else if(it.type==='magnet'){ai.magnet=480;}
  else if(it.type==='rocket'){ai.rocket=180;}
  else if(it.type==='slow'){ai.slow=300;}
}
function updLives(){
  const el=document.getElementById('hlv');el.innerHTML='';
  const mx=hp('extra_life')?4:3;
  for(let i=0;i<mx;i++){const s=document.createElement('span');s.textContent=i<lives?'❤️':'🖤';el.appendChild(s);}
}
function updItemBar(){
  const em={shield:'🛡️',magnet:'🧲',rocket:'🚀',slow:'⏰'};
  let h='';
  Object.entries(ai).forEach(([k,v])=>{if(v>0)h+=`<div class="ich">${em[k]}<span class="ict">${Math.ceil(v/60)}s</span></div>`;});
  document.getElementById('ibar').innerHTML=h;
}

// ── GAME OVER ─────────────────────────────────────────────────
function doGameOver(){
  mode='gameover';
  ['hud','ibar','mc'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  const isNew=score>sv.best;
  if(isNew)sv.best=score;
  sv.coins+=crun; 
  sd();
  document.getElementById('goSc').textContent=score;
  document.getElementById('goBt').textContent=sv.best;
  document.getElementById('goCo').textContent=crun;
  document.getElementById('goNew').classList.toggle('hidden',!isNew);
  show('pGO');
}
function goMenu(){
  mode='menu';
  ['hud','ibar','mc'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('mBest').textContent=sv.best;
  document.getElementById('mCoins').textContent=sv.coins;
  show('pMenu');
}

// ── PANEL ─────────────────────────────────────────────────────
function show(id){
  ['pMenu','pChar','pShop','pGO'].forEach(p=>document.getElementById(p).classList.add('hidden'));
  if(id)document.getElementById(id).classList.remove('hidden');
}

// ── CHAR GRID ─────────────────────────────────────────────────
function renderChars(){
  const g=document.getElementById('cgrid');g.innerHTML='';
  CHARS.forEach(c=>{
    const owned=sv.owned.includes(c.id),sel=sv.sel===c.id;
    const d=document.createElement('div');
    d.className='cc'+(sel?' sel':'')+(owned?'':' lk');
    d.innerHTML=`<span class="ci">${c.icon}</span><div class="cn">${c.name}</div><div class="cd">${c.desc}</div>
      ${owned?'':`<div class="cp">💰${c.price}</div><span class="lki">🔒</span>`}`;
    d.onclick=()=>{
      if(owned){sv.sel=c.id;sd();renderChars();}
      else if(sv.coins>=c.price){sv.coins-=c.price;sv.owned.push(c.id);sv.sel=c.id;sd();renderChars();
        document.getElementById('mCoins').textContent=sv.coins;}
    };
    g.appendChild(d);
  });
}
function renderShop(){
  document.getElementById('shopCoin').textContent='💰 보유 금화: '+sv.coins;
  const l=document.getElementById('slist');l.innerHTML='';
  PERKS.forEach(it=>{
    const owned=sv.perks.includes(it.id);
    const d=document.createElement('div');d.className='si';
    d.innerHTML=`<span class="sic">${it.icon}</span>
      <div class="sinf"><div class="sn">${it.name}${owned?' ✅':''}</div><div class="sd">${it.desc}</div></div>
      <button class="bbuy" ${owned||sv.coins<it.price?'disabled':''}>${owned?'보유중':'💰'+it.price}</button>`;
    if(!owned)d.querySelector('.bbuy').onclick=()=>{
      if(sv.coins>=it.price){sv.coins-=it.price;sv.perks.push(it.id);sd();renderShop();}
    };
    l.appendChild(d);
  });
}

// ── BUTTONS ───────────────────────────────────────────────────
document.getElementById('bPlay').onclick   = startGame;
document.getElementById('bChar').onclick   = ()=>{renderChars();show('pChar');};
document.getElementById('bShop').onclick   = ()=>{renderShop();show('pShop');};
document.getElementById('bCharBack').onclick=goMenu;
document.getElementById('bShopBack').onclick=goMenu;
document.getElementById('bRetry').onclick  = startGame;
document.getElementById('bGOMenu').onclick = goMenu;

// ── MAIN LOOP ─────────────────────────────────────────────────
function loop(){
  ctx.save();
  if(shake>0){
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    shake*=0.9;
  }
  ctx.clearRect(0,0,W,H);
  drawBG();

  if(mode==='play'||mode==='dead'){
    if(mode==='play') update();
    drawObs();
    drawItems();
    
    const flash=inv>0&&Math.floor(Date.now()/80)%2===0;
    if(!flash) drawChar(P.x, P.y, P.w, P.h, sv.sel, P.af, P.sl);
    
    if(inv>0||ai.shield>0){
      ctx.strokeStyle='rgba(100,200,255,0.65)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(P.x+P.w/2,P.y+P.h/2,P.w*0.75,0,Math.PI*2);ctx.stroke();
    }
    
    if(ai.rocket>0){
      for(let i=0;i<5;i++){
        ctx.fillStyle=`rgba(255,${Math.random()*100+100},0,${Math.random()*0.8})`;
        ctx.beginPath();ctx.arc(P.x-i*8+Math.random()*6,P.y+P.h/2+Math.random()*12,6-i,0,Math.PI*2);ctx.fill();
      }
    }
    drawParts();
  } else {
    drawParts();
    const t=Date.now()*0.002;
    const iy=GY-56+Math.sin(t)*10;
    drawChar(W/2-28, iy, 56, 56, sv.sel, Math.floor(t*2)%4, false);
  }

  ctx.restore();
  requestAnimationFrame(loop);
}

// ── START ─────────────────────────────────────────────────────
goMenu();
loop();
</script>
