<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🍪 쿠키 대탈주 Premium - Spark Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a001e;position:relative;font-family:'Segoe UI', sans-serif;}
#gw{position:absolute;top:0;left:0;width:480px;height:854px;transform-origin:top left;}
canvas{position:absolute;top:0;left:0;width:480px;height:854px;display:block}
#ov{position:absolute;top:0;left:0;width:480px;height:854px;}
.panel{position:absolute;top:0;left:0;width:480px;height:854px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;z-index:20;}
.hidden{display:none!important}
#pMenu{background:linear-gradient(180deg,#0a001e 0%,#250050 55%,#c84010 85%,#90300a 100%)}
.title{font:900 52px/1 sans-serif;color:#FFD700;text-shadow:0 0 30px #ff6600,0 6px 0 #880000;animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-15px)}}
.mbtn{display:block;padding:16px 50px;border:none;border-radius:50px;font:900 20px/1 sans-serif;cursor:pointer;margin:8px;transition:0.1s;}
.mbtn:active{transform:scale(0.9)}
.bplay{background:linear-gradient(135deg,#FFD700,#ff6600);color:#3d0000;box-shadow:0 6px 20px #ff660066}
.bchar{background:#a855f7;color:#fff}.bshop{background:#0ea5e9;color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:380px}
.cc{background:#ffffff10;border:2px solid #fff2;border-radius:15px;padding:15px 5px;text-align:center;cursor:pointer;}
.cc.sel{border-color:#FFD700;background:#FFD70020}
.ci{font-size:40px;display:block}
.si{background:#fff1;border-radius:12px;padding:15px;display:flex;align-items:center;gap:15px;width:380px;margin-bottom:10px}
#hud{position:absolute;top:0;left:0;width:480px;padding:20px;display:flex;justify-content:space-between;color:#FFD700;font:900 26px sans-serif;text-shadow:0 2px 4px #000;pointer-events:none;z-index:10;}
#ibar{position:absolute;bottom:120px;left:0;width:480px;display:flex;justify-content:center;gap:10px;pointer-events:none;}
.ich{background:#000b;border:1px solid #fff3;border-radius:10px;padding:6px 12px;color:#fff;display:flex;align-items:center;gap:5px;}
#mc{position:absolute;bottom:20px;left:0;width:480px;display:flex;justify-content:space-between;padding:0 30px;z-index:15;}
.cb{width:80px;height:80px;border-radius:50%;background:#ffffff20;border:3px solid #fff5;display:flex;align-items:center;justify-content:center;font-size:30px;user-select:none;cursor:pointer;}
.cb:active{background:#ffffff40}
</style>
</head>
<body>
<div id="gw">
  <canvas id="c" width="480" height="854"></canvas>
  <div id="ov">
    <div id="pMenu" class="panel">
      <div class="title">🍪 쿠키 대탈주</div>
      <div style="color:#ffb347;letter-spacing:8px;font-weight:700;margin-bottom:40px">SPARK EDITION</div>
      <button class="mbtn bplay" id="bPlay">PLAY START</button>
      <button class="mbtn bchar" id="bChar">CHARACTERS</button>
      <button class="mbtn bshop" id="bShop">SHOP</button>
      <div style="color:#FFD700;margin-top:20px;font-weight:900">BEST: <span id="mBest">0</span> | GOLD: <span id="mCoins">0</span></div>
    </div>
    <div id="pChar" class="panel hidden">
      <div style="font:900 28px sans-serif;color:#FFD700;margin-bottom:20px">CHARACTER SELECT</div>
      <div class="cgrid" id="cgrid"></div>
      <button class="mbtn bchar" style="margin-top:20px" id="bCharBack">BACK</button>
    </div>
    <div id="pShop" class="panel hidden">
      <div style="font:900 28px sans-serif;color:#FFD700;margin-bottom:20px">SPARK SHOP</div>
      <div id="slist"></div>
      <button class="mbtn bchar" id="bShopBack">BACK</button>
    </div>
    <div id="hud" class="hidden">
      <div>⭐ <span id="hsc">0</span></div>
      <div>💰 <span id="hco">0</span></div>
    </div>
    <div id="ibar" class="hidden"></div>
    <div id="mc" class="hidden">
      <div class="cb" id="cj">JUMP</div>
      <div class="cb" id="cs">SLIDE</div>
    </div>
    <div id="pGO" class="panel hidden">
      <div class="got">GAME OVER</div>
      <div class="gos">SCORE: <span id="goSc">0</span></div>
      <button class="mbtn bplay" style="margin-top:30px" id="bRetry">RETRY</button>
      <button class="mbtn bchar" id="bGOMenu">HOME</button>
    </div>
  </div>
</div>

<script>
const W=480, H=854, GY=H-120;
const CHARS=[
  {id:'cookie',n:'쿠키 용사',ic:'🍪',col:'#f4a261',pr:0},
  {id:'strawberry',n:'딸기 쿠키',ic:'🍓',col:'#e63946',pr:100},
  {id:'choco',n:'초코 쿠키',ic:'🍫',col:'#6d4c41',pr:150},
  {id:'cupcake',n:'컵케이크',ic:'🧁',col:'#f48fb1',pr:200},
  {id:'moon',n:'달빛 쿠키',ic:'🌙',col:'#7986cb',pr:250},
  {id:'rainbow',n:'레인보우',ic:'🌈',col:'#ab47bc',pr:500}
];
const PERKS=[{id:'life',n:'Life +1',ic:'❤️',pr:100},{id:'score',n:'Score x2',ic:'⭐',pr:150}];

let sv={best:0,coins:0,sel:'cookie',owned:['cookie'],perks:[]};
let mode='menu',score=0,lives=3,speed=4,fr=0,crun=0,oT=0,iT=0,inv=0,shake=0,bgx=0;
let ai={shield:0,magnet:0,rocket:0};
let OBS=[],ITMS=[],PARTS=[],CLDS=[];
const P={x:80,y:GY-56,w:60,h:60,vy:0,jmp:false,sl:false,slt:0};
let canvas,ctx,gw;

function ld(){ try{const d=JSON.parse(localStorage.getItem('cke_v3')||'{}'); if(d.best)sv.best=d.best; if(d.coins)sv.coins=d.coins; if(d.sel)sv.sel=d.sel; if(d.owned)sv.owned=d.owned; if(d.perks)sv.perks=d.perks;}catch(e){} }
function sd(){ try{localStorage.setItem('cke_v3',JSON.stringify(sv));}catch(e){} }
function resize(){ if(!gw)return; const s=Math.min(window.innerWidth/W,window.innerHeight/H); gw.style.transform=`translate(${(window.innerWidth-W*s)/2}px,${(window.innerHeight-H*s)/2}px) scale(${s})`; }

function jump(){ if(mode!=='play')return; const boost=(sv.sel==='strawberry'||sv.sel==='rainbow')?1.2:1; if(!P.jmp){P.vy=-17*boost;P.jmp=true;burst(P.x+30,P.y+60,'#fff',8);} else if(P.vy>-5)P.vy=-12*boost; }
function slide(){ if(mode!=='play'||P.sl)return; P.sl=true;P.slt=40;P.h=30;P.y+=30; if(P.jmp)P.vy=8; }

function burst(x,y,col,n){ for(let i=0;i<n;i++)PARTS.push({x,y,vx:(Math.random()-0.5)*10,vy:Math.random()*-6,col,life:1,r:Math.random()*6+2}); }

function update(){
  fr++; const spd=(speed||4)*(ai.rocket>0?1.8:1);
  P.vy+=0.65; P.y+=P.vy; if(P.y>=GY-P.h){P.y=GY-P.h;P.vy=0;P.jmp=false;} else P.jmp=true;
  if(P.sl){P.slt--; if(P.slt<=0){P.sl=false;P.h=60;P.y-=30;}}
  Object.keys(ai).forEach(k=>{if(ai[k]>0)ai[k]--;}); if(inv>0)inv--;
  if(fr%6===0){ score+=(sv.perks.includes('score')?2:1); document.getElementById('hsc').textContent=score; }
  if(fr%600===0&&speed<14)speed+=0.5;

  oT++; if(oT>Math.max(35,110-speed*5)){ OBS.push({t:['rock','cactus','eagle','fire'][Math.floor(Math.random()*4)],x:W+50,w:50,h:50,y:GY-50});oT=0; }
  iT++; if(iT>150){ ITMS.push({t:['coin','shield','magnet','rocket'][Math.floor(Math.random()*4)],x:W+50,y:GY-60-Math.random()*150,w:30,h:30});iT=0; }

  OBS=OBS.filter(o=>{ o.x-=spd; if(o.x<-60)return false; if(inv<=0&&ai.shield<=0&&ai.rocket<=0){ if(P.x+10<o.x+o.w-5&&P.x+P.w-10>o.x+5&&P.y+10<o.y+o.h-5&&P.y+P.h-10>o.y+5){ burst(P.x+30,P.y+30,'#f33',20); shake=15; lives--; inv=100; if(lives<=0){mode='dead';setTimeout(doGO,600);} return false; } } return true; });
  ITMS=ITMS.filter(it=>{ it.x-=spd; if(it.x<-60)return false; if(P.x<it.x+it.w&&P.x+P.w>it.x&&P.y<it.y+it.h&&P.y+P.h>it.y){ if(it.t==='coin'){crun++;sv.coins++;document.getElementById('hco').textContent=sv.coins;} else if(it.t==='shield')ai.shield=300; else if(it.t==='magnet')ai.magnet=400; else if(it.t==='rocket')ai.rocket=150; return false; } return true; });
  bgx+=spd*0.5; CLDS.forEach(c=>{c.x-=c.sp; if(c.x<-200)c.x=W+100;});
}

function drawChar(px,py,pw,ph,id,sl){
  const c=CHARS.find(x=>x.id===id)||CHARS[0]; ctx.save(); ctx.translate(px+pw/2,py+ph/2);
  
  // Body (Round Cookie Shape)
  ctx.fillStyle=c.col;
  ctx.beginPath();
  if(sl) ctx.ellipse(0,0,pw*0.6,ph*0.35,0,0,Math.PI*2);
  else ctx.ellipse(0,0,pw*0.45,ph*0.48,0,0,Math.PI*2);
  ctx.fill();

  // Chocolate Chips (Decoration)
  ctx.fillStyle='rgba(0,0,0,0.15)';
  [[-12,-15],[10,5],[-5,18]].forEach(([cx,cy])=>{
    ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2); ctx.fill();
  });

  // Eyes
  ctx.fillStyle='#fff';
  const ey = sl ? -5 : -ph*0.15;
  ctx.beginPath(); ctx.arc(-12,ey,8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(10,ey,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(-10,ey,3.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(12,ey,3.5,0,Math.PI*2); ctx.fill();
  
  ctx.restore();
}

function show(id){ ['pMenu','pChar','pShop','pGO'].forEach(p=>{const e=document.getElementById(p);if(e)e.classList.add('hidden');}); const t=document.getElementById(id);if(t)t.classList.remove('hidden'); }
function startGame(){ score=0;crun=0;speed=4;lives=sv.perks.includes('life')?4:3; mode='play';ai={shield:0,magnet:0,rocket:0};OBS=[];ITMS=[];show(null); ['hud','ibar','mc'].forEach(id=>document.getElementById(id).classList.remove('hidden')); }
function doGO(){ mode='gameover'; if(score>sv.best)sv.best=score; sv.coins+=crun; sd(); document.getElementById('goSc').textContent=score; show('pGO'); }
function goMenu(){ mode='menu'; ['hud','ibar','mc'].forEach(id=>document.getElementById(id).classList.add('hidden')); document.getElementById('mBest').textContent=sv.best; document.getElementById('mCoins').textContent=sv.coins; show('pMenu'); }

function draw(){
  ctx.save(); if(shake>0){ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake*=0.9;} ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a002a');g.addColorStop(1,'#6b2405'); ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  CLDS.forEach(c=>{ctx.fillStyle=`rgba(255,255,255,${c.a})`;ctx.beginPath();ctx.ellipse(c.x,c.y,c.w,c.h,0,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='#8b4513';ctx.fillRect(0,GY,W,H-GY);
  if(mode==='play'||mode==='dead'){
    if(mode==='play')update();
    const em={rock:'🪨',cactus:'🌵',eagle:'🦅',fire:'🔥',coin:'💰',shield:'🛡️',magnet:'🧲',rocket:'🚀'};
    OBS.forEach(o=>{ctx.font='40px serif';ctx.fillText(em[o.t],o.x,o.y+40);});
    ITMS.forEach(it=>{ctx.font='32px serif';ctx.fillText(em[it.t],it.x,it.y+32);});
    if(!(inv>0&&Math.floor(fr/5)%2===0)) drawChar(P.x,P.y,P.w,P.h,sv.sel,P.sl);
    if(ai.shield>0){ctx.strokeStyle='#0cf';ctx.lineWidth=4;ctx.beginPath();ctx.arc(P.x+P.w/2,P.y+P.h/2,P.w*0.8,0,7);ctx.stroke();}
    if(ai.rocket>0){ctx.fillStyle='#f90';for(let i=0;i<5;i++)ctx.fillRect(P.x-10-i*10,P.y+20+Math.random()*20,10,10);}
  } else { ctx.font='80px serif';ctx.textAlign='center';ctx.fillText(CHARS.find(x=>x.id===sv.sel).ic,W/2,GY-70+Math.sin(Date.now()*0.004)*20); }
  PARTS=PARTS.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life-=0.03;if(p.life>0){ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();} return p.life>0;});
  ctx.restore(); requestAnimationFrame(draw);
}

window.onload=()=>{
  canvas=document.getElementById('c'); ctx=canvas.getContext('2d'); gw=document.getElementById('gw');
  CLDS=Array.from({length:8},()=>({x:Math.random()*W,y:Math.random()*150+50,w:Math.random()*80+60,h:Math.random()*20+20,a:0.2,sp:Math.random()+0.5}));
  ld(); if(!ctx.ellipse)ctx.ellipse=function(x,y,rx,ry,rot,sa,ea){this.save();this.translate(x,y);this.rotate(rot);this.scale(rx,ry);this.arc(0,0,1,sa,ea);this.restore();};
  
  canvas.onmousedown=e=>{if(e.button===0)jump();};
  canvas.ontouchstart=e=>{e.preventDefault();jump();};
  document.getElementById('cj').onmousedown=e=>{e.preventDefault();jump();};
  document.getElementById('cs').onmousedown=e=>{e.preventDefault();slide();};
  document.getElementById('cj').ontouchstart=e=>{e.preventDefault();jump();};
  document.getElementById('cs').ontouchstart=e=>{e.preventDefault();slide();};
  window.onkeydown=e=>{ if(e.code==='Space'||e.code==='ArrowUp')jump(); if(e.code==='ArrowDown'||e.key==='Shift')slide(); };

  document.getElementById('bPlay').onclick=startGame;
  document.getElementById('bChar').onclick=()=>{
    const g=document.getElementById('cgrid'); g.innerHTML='';
    CHARS.forEach(c=>{
      const owned=sv.owned.includes(c.id),sel=sv.sel===c.id,d=document.createElement('div');
      d.className='cc'+(sel?' sel':'')+(owned?'':' lk');
      d.innerHTML=`<span class="ci">${c.ic}</span><div style="color:#fff;font-size:12px;font-weight:700">${c.n}</div>${owned?'':`<div style="color:#FFD700;font-size:12px">💰${c.pr}</div>`}`;
      d.onclick=()=>{if(owned){sv.sel=c.id;sd();show('pChar');}else if(sv.coins>=c.pr){sv.coins-=c.pr;sv.owned.push(c.id);sv.sel=c.id;sd();show('pChar');}};
      g.appendChild(d);
    });
    show('pChar');
  };
  document.getElementById('bShop').onclick=()=>{
    const l=document.getElementById('slist'); l.innerHTML='';
    PERKS.forEach(p=>{
      const owned=sv.perks.includes(p.id),d=document.createElement('div'); d.className='si';
      d.innerHTML=`<span style="font-size:30px">${p.ic}</span><div style="flex:1"><div style="color:#fff;font-weight:700">${p.n}</div></div><button class="mbtn bplay" style="padding:10px 20px;font-size:14px" ${owned?'disabled':''}>${owned?'OWNED':'💰'+p.pr}</button>`;
      if(!owned)d.querySelector('button').onclick=()=>{if(sv.coins>=p.pr){sv.coins-=p.pr;sv.perks.push(p.id);sd();show('pShop');}};
      l.appendChild(d);
    });
    show('pShop');
  };
  document.getElementById('bCharBack').onclick=goMenu;
  document.getElementById('bShopBack').onclick=goMenu;
  document.getElementById('bRetry').onclick=startGame;
  document.getElementById('bGOMenu').onclick=goMenu;
  
  window.onresize=resize; resize(); goMenu(); draw();
};
</script>
</body>
</html>
